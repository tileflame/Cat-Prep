<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat SAT</title>
<!-- The ?v= stamps on these two are filled in by server.stamp_shell from each

     the moment app.js changes and the browser then serves the old one. -->
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand"><img src="/logo.png" alt="" class="mark">Cat SAT</div>
    <nav class="nav" id="nav"></nav>
    <div class="spacer"></div>
    <div id="topright" class="row tight"></div>
  </div>
  <main class="screen" id="screen"><div class="spin"></div></main>
</div>
<div id="overlay"></div>
<script src="/app.js"></script>
</body>
</html>
